<style>
:root {
  --bg: #e9e9e7; --panel: #ffffff; --panel-2: #efefed; --ink: #222222; --muted: #666666;
  --line: #b9b9b5; --accent: #111111; --accent-ink: #e9e9e7; --accent-soft: #dcdcd8;
  --warn: #7a5a00; --warn-soft: #f1ead6; --ok: #2f6b3a; --ok-soft: #e1ece3; --danger: #a3261e;
  --you: #efefed; --you-ink: #222222; --shadow: none;
  --acc: #c8f31d; --acc-ink: #111111;   /* the small bright accent; the user can change it under Look */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --panel: #1b1b1b; --panel-2: #242424; --ink: #e9e9e7; --muted: #9a9a96;
    --line: #3c3c3a; --accent: #e9e9e7; --accent-ink: #111111; --accent-soft: #2c2c2a;
    --warn: #e8c46a; --warn-soft: #2f2a1a; --ok: #8fd19a; --ok-soft: #1d2d21; --danger: #ff9a90;
    --you: #242424; --you-ink: #e9e9e7;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --panel: #1b1b1b; --panel-2: #242424; --ink: #e9e9e7; --muted: #9a9a96;
  --line: #3c3c3a; --accent: #e9e9e7; --accent-ink: #111111; --accent-soft: #2c2c2a;
  --warn: #e8c46a; --warn-soft: #2f2a1a; --ok: #8fd19a; --ok-soft: #1d2d21; --danger: #ff9a90;
  --you: #242424; --you-ink: #e9e9e7;
}
:root[data-acc="orange"] { --acc: #ff5b1f; --acc-ink: #111111; }
:root[data-acc="blue"] { --acc: #2f6bff; --acc-ink: #ffffff; }
:root[data-acc="pink"] { --acc: #ff2e88; --acc-ink: #111111; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.pill.running { background: var(--accent-soft); color: var(--accent); }
.pill.error { background: #f9dedc; color: var(--danger); }
header .spacer { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 10px; font-size: 13px; border-radius: 7px; }
.btn:disabled { opacity: .5; cursor: default; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; max-width: 1280px;
  margin: 0 auto; padding: 20px; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; padding: 12px 16px; } }

/* ---------- start screen ---------- */
.start { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 700px) { .start { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
  box-shadow: var(--shadow); }
.card h2 { margin: 0 0 6px; font-size: 17px; }
.card p { margin: 0 0 12px; color: var(--muted); }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input[type=text], input[type=password], input[type=email], input[type=number], textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.row { display: flex; gap: 10px; }
.row > div { flex: 1; }
.check { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0; font-size: 14px; color: var(--ink); }
.check input { margin-top: 3px; }
details { margin-top: 8px; font-size: 14px; }
summary { cursor: pointer; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--danger); font-size: 14px; margin-top: 8px; }

.accs { display: grid; gap: 6px; margin: 4px 0 10px; }
.acc { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 9px; margin: 0; color: var(--ink); font-size: 14px; }
.acc-name { font-weight: 600; flex: 1; }
.addbox { border: 1px dashed var(--line); border-radius: 10px; padding: 4px 14px 14px; margin-top: 6px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0 4px; }
.acc-divider { font-weight: 650; margin: 18px 0 10px; font-size: 15px; }

.reader { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
.reader.on { border-color: var(--accent); background: var(--accent-soft); }
.reader-head { display: flex; gap: 8px; align-items: center; margin: 0; color: var(--ink); font-size: 15px; cursor: pointer; }
.reader-head .pill { margin-left: auto; }
.reader-body { margin: 6px 0 2px 24px; font-size: 14px; }
.reader-body p { margin: 4px 0 8px; color: var(--muted); }
.reader:not(.on) .reader-body { display: none; }
.steps { margin: 4px 0 6px; padding-left: 20px; }
.bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar div { height: 100%; background: var(--accent); transition: width .4s; }

.pill.wait { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.pill .tally { opacity: .85; font-weight: 500; }
.pill.done { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; }
.spin { width: 18px; height: 18px; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; flex: none; display: inline-block; }
.spin.sm { width: 11px; height: 11px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
.working { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line);
  background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.working-card { padding: 0; overflow: hidden; margin-bottom: 14px; }
.working-card .working { border-top: 0; }

.reading { border: 1px solid var(--accent); border-radius: 10px; background: var(--panel); margin: 4px 0; overflow: hidden; }
.reading-head { background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 8px 12px; font-size: 13px; }
.reading-meta { padding: 8px 14px 0; font-size: 12px; color: var(--muted); }
.reading-body { padding: 8px 14px 14px; white-space: pre-wrap; word-wrap: break-word; max-height: 55vh; overflow-y: auto;
  font-size: 15px; line-height: 1.6; }

.tag { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 6px; }
.tag.imp { background: var(--warn-soft); color: var(--warn); }
.tag.new { background: var(--ok-soft); color: var(--ok); }
.cat.cat-sec { background: #e5ecfb; color: #2b4c9a; }
.tag.sec { background: #e5ecfb; color: #2b4c9a; }
@media (prefers-color-scheme: dark) { .cat.cat-sec { background: #e5ecfb; color: #2b4c9a; }
.tag.sec { background: #1f2a44; color: #9db6f0; } }
.warn { margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: 14px; border: 1px solid; }
.warn ul { margin: 6px 0 4px; padding-left: 20px; }
.warn-tip { font-size: 13px; margin-top: 4px; opacity: .9; }
.warn.high { background: #fdecea; border-color: #f2b8b5; color: #8c1d18; }
.warn.low { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.warn.info { background: #eef3fd; border-color: #cfdcf7; color: #2b4c9a; }
@media (prefers-color-scheme: dark) {
  .warn.high { background: #3a1d1b; border-color: #6b2b27; color: #ffb4ab; }
  .warn.info { background: #1c2436; border-color: #2c3a5c; color: #b8c9f2; }
}
.imp-reason { margin-top: 8px; font-size: 13px; color: var(--warn); font-weight: 600; }

/* ---------- feed ---------- */
.banner { padding: 10px 14px; border-radius: 10px; background: var(--panel-2); color: var(--muted);
  font-size: 14px; margin-bottom: 12px; }
.mail { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px;
  box-shadow: var(--shadow); overflow: hidden; }
.mail.past { opacity: .78; }
.mail.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); opacity: 1; }
.mail-head { padding: 14px 18px 10px; }
.meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.cat { text-transform: uppercase; letter-spacing: .04em; font-weight: 650; font-size: 11px; padding: 2px 8px;
  border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.subject { font-size: 16px; font-weight: 650; margin: 6px 0 2px; }
.from { font-size: 13px; color: var(--muted); }
.summary { margin: 8px 0 0; }
.facts { margin: 10px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.facts code { background: var(--panel-2); padding: 1px 6px; border-radius: 5px; font-weight: 600; }
.lines { border-top: 1px solid var(--line); padding: 10px 18px; display: grid; gap: 6px; font-size: 14px; }
.line { display: flex; gap: 8px; align-items: flex-start; }
.line .ic { width: 18px; text-align: center; flex: none; font-weight: 700; }
.line.done .ic { color: var(--ok); }
.line.notice { background: var(--warn-soft); margin: 0 -8px; padding: 6px 8px; border-radius: 8px; }
.line.notice .ic { color: var(--warn); }
.line.you { justify-content: flex-end; }
.line.you span { background: var(--you); color: var(--you-ink); padding: 5px 11px; border-radius: 12px 12px 3px 12px;
  max-width: 85%; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: 13px; }

.ask { border-top: 1px solid var(--line); background: var(--panel-2); padding: 14px 18px 16px; }
.ask .prompt { font-weight: 650; margin-bottom: 10px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); display: flex; gap: 10px; align-items: baseline; }
.choice:hover { border-color: var(--accent); }
.choice .k { font-size: 12px; color: var(--muted); min-width: 14px; }
.choice.secondary { background: transparent; color: var(--muted); }
.answer-row { display: flex; gap: 8px; }
.answer-row textarea { resize: none; min-height: 44px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); }
.chip:hover { border-color: var(--accent); }
.chip.util { background: transparent; }
.chips-label { font-size: 12px; color: var(--muted); margin-top: 12px; }

.done-card h2 { margin-top: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 12px 0 16px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--muted); }

/* ---------- sidebar ---------- */
aside { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
@media (max-width: 900px) { aside { position: static; max-height: none; } }
.tabs { display: flex; flex-wrap: wrap; flex: none; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab { flex: 1 1 auto; padding: 10px 4px; border: 0; background: none; font-size: 12.5px; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { font-size: 11px; background: var(--panel-2); border-radius: 99px; padding: 0 6px; margin-left: 3px; }
.when { margin: 4px 0 2px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.when-chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
  background: var(--panel-2); color: var(--muted); }
.when-chip.overdue { background: #f9dedc; color: #b3261e; }
.when-chip.soon { background: #ffe3c2; color: #9a4a00; }
.when-chip.week { background: #fff1c9; color: #7a5a00; }
.when-chip.later { background: #e3ecfb; color: #2f5596; }
.is-done .when-chip { opacity: .6; }
@media (prefers-color-scheme: dark) {
  .when-chip.overdue { background: #5c1f1b; color: #ffb4ab; } .when-chip.soon { background: #5a3300; color: #ffcf99; }
  .when-chip.week { background: #4a3c00; color: #f5dc8a; } .when-chip.later { background: #1e3157; color: #b3c8f2; } }
.when-text { font-size: 12px; color: var(--muted); }
.cu-bar { padding: 8px 0 2px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; }
.cu-box { margin: 10px 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: 13px; }
.cu-box .t { font-weight: 600; margin-bottom: 6px; }
.cu-box input[type=number] { width: 64px; padding: 3px 6px; margin: 0 4px; }
.cu-preview { margin-top: 6px; }
.pane { overflow-y: auto; padding: 6px 14px 14px; flex: 1 1 auto; min-height: 0; }
.note-text { white-space: pre-wrap; font-size: 13px; margin-top: 4px; }
.rw-banner { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent);
  background: var(--accent-soft); border-radius: 8px; padding: 5px 9px; margin: 4px 0; }
.is-rewriting .t, .is-rewriting .about { opacity: .55; }
.link:disabled { color: var(--muted); text-decoration: none; cursor: default; }
.about { font-size: 13px; color: var(--muted); margin: 2px 0; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.acts a.link { font-size: 13px; }
.note-edit input, .note-edit textarea { width: 100%; font-size: 14px; padding: 7px 9px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); margin-top: 6px; }
.note-edit textarea { min-height: 110px; resize: vertical; }
.link.danger { color: var(--danger); }
.item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.item:last-child { border-bottom: 0; }

.loc.trash { color: var(--danger); }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center;
  justify-content: center; padding: 16px; z-index: 20; }
.modal-bg.show { display: flex; }
.modal { background: var(--panel); border-radius: 14px; width: min(980px, 100%); max-height: 92vh; display: flex;
  flex-direction: column; overflow: hidden; }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.viewer { display: flex; flex-direction: column; background: var(--panel); }
.viewer-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 14px;
  border-bottom: 1px solid var(--line); background: var(--panel-2); font-size: 13px; }
.viewer-tools .hint { margin-left: 6px; }
.seg { border: 1px solid var(--line); background: var(--panel); padding: 3px 10px; font-size: 13px; }
.seg:first-child { border-radius: 7px 0 0 7px; } .seg:nth-child(2) { border-radius: 0 7px 7px 0; margin-left: -9px; }
.seg.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mailframe { width: 100%; border: 0; background: #fff; display: block; }
.viewer.modal .mailframe { height: 68vh; }
.viewer.reading .mailframe { height: 60vh; }
.modal-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end;
  align-items: center; }
.modal-foot .hint { margin-right: auto; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 9px; font-size: 14px; display: none; z-index: 30; }

/* ---------- v1.1 look: grey, dashed, one bright accent (system fonts only: nothing is loaded from the internet) ---------- */
body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
header h1, .card h2, .ins-h { font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-weight: 400; letter-spacing: .06em; }

.btn { border: 1.5px solid var(--ink); border-radius: 99px; padding: 7px 16px; background: transparent; }
.btn:hover { border-color: var(--ink); background: var(--panel-2); }

.card, .mail, aside, .modal { border: 1.5px dashed var(--line); box-shadow: none; }

.pill { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); }
.pill.running, .pill.wait, .pill.done { background: transparent; color: var(--ink); }

.tabs { gap: 4px; padding: 8px; border-bottom: 1.5px dashed var(--line); }

.tab .n { background: transparent; padding: 0 0 0 4px; }
.cat { background: var(--acc); color: var(--acc-ink); border: 1.5px solid var(--ink); border-radius: 0; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; font-size: 11px; padding: 1px 8px; }
.cat.cat-sec { background: var(--ink); color: var(--bg); }
.when-chip { border: 1.5px solid var(--ink); border-radius: 99px; background: transparent; color: var(--ink); font-weight: 500; }
.when-chip.overdue, .when-chip.soon { background: var(--acc); color: var(--acc-ink); font-weight: 600; }
.when-chip.week, .when-chip.later { background: transparent; color: var(--ink); }
.tag.new, .tag.imp { background: var(--acc); color: var(--acc-ink); border: 1.5px solid var(--ink); border-radius: 0; }
.toast { background: var(--acc); color: var(--acc-ink); border: 1.5px solid var(--ink); border-radius: 8px; }
.bar div, .rw-banner { background: var(--ink); }
.rw-banner { background: var(--accent-soft); color: var(--ink); }
.reading, .reading-head { border-color: var(--ink); }
.stat { background: transparent; border: 1.5px dashed var(--line); border-radius: 14px; text-align: center; }
.stat b { font-size: 34px; font-weight: 400; font-family: ui-sans-serif, system-ui, sans-serif; }
.movefail { margin: 8px 0; padding: 10px 14px; border: 2px solid var(--danger); border-radius: 12px; display: grid; gap: 2px; }
.movefail b { letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--danger); }
.skiplist { border: 1.5px dashed var(--line); border-radius: 14px; padding: 12px 16px; margin: 12px 0; }
.skiplist h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.skiplist .li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--line); }
/* Insights and Look panels */
.ins { display: grid; gap: 14px; padding: 8px 0; }

.ins-ring .big { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 44px; fill: var(--ink); }

.ins-trust { text-align: center; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ins-trust .hearts { font-size: 22px; letter-spacing: 6px; color: var(--ink); display: block; }
.ins-box { border: 1.5px dashed var(--line); border-radius: 14px; padding: 12px 14px; }
.ins-box h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 400; }

.ins-row:first-of-type { border-top: 0; }
.ins-saved { display: flex; border: 1.5px solid var(--ink); font-size: 14px; }
.ins-saved span { padding: 7px 12px; background: var(--panel); }
.ins-saved b { flex: 1; text-align: right; padding: 7px 12px; font-weight: 400; background: var(--acc); color: var(--acc-ink); letter-spacing: .08em; }
.ins-foot { font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; text-align: center; }
.look { display: grid; gap: 14px; padding: 8px 0; }
.look h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chipbtn { border: 1.5px solid var(--ink); border-radius: 99px; background: transparent; padding: 3px 12px; font-size: 13px; }
.chipbtn.on { background: var(--acc); color: var(--acc-ink); font-weight: 600; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { display: grid; justify-items: center; gap: 6px; padding: 10px 8px; min-width: 78px; border: 1.5px dashed var(--line);
  border-radius: 14px; background: transparent; font-size: 12px; }
.swatch.on { border: 2px solid var(--ink); background: var(--panel); }
.swatch i { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink); display: block; }
.swatch small { color: var(--muted); font-size: 10px; letter-spacing: .06em; }
.preview { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>✉ Mail Agent</h1>
  <span id="status" class="pill">idle</span>
  <span id="who" class="hint"></span>
  <span class="spacer"></span>
  <button id="stopBtn" class="btn danger" style="display:none">Stop for now</button>
  <button id="newBtn" class="btn quiet" style="display:none">New session</button>
  <button id="quitBtn" class="btn quiet" title="Quit Mail Agent (anything not handled stays in your inbox)">Quit</button>
</header>

<div class="layout">
  <main id="main"></main>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </aside>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head" id="mHead"></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot">
      <span class="hint" id="mWhere"></span>
      <button class="btn" id="mRestore">Put back in inbox</button>
      <button class="btn primary" id="mClose">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"},
                                                        body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 2600); }

let lastActivity = null;
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
let S = {status: "idle"}, events = [], cards = [], banner = [], lastQ = null, draft = "";
let tab = "todos", panels = {}, panelSig = "", seenOriginal = -1, pageStart = true;

// ------------------------------------------------------------ polling
let quitting = false;
async function poll() {
  if (quitting) return;
  try {
    const st = await api(`/api/state?since=${events.length}`);
    const fresh = st.events || [];
    if (st.status !== S.status && st.status === "connecting") { events = []; }
    events.push(...fresh);
    const qChanged = JSON.stringify(st.question) !== JSON.stringify(lastQ);
    const statusChanged = st.status !== S.status || st.error !== S.error;
    S = st; lastQ = st.question;
    const actChanged = st.activity !== lastActivity; lastActivity = st.activity;
    if (fresh.length || qChanged || statusChanged || actChanged) { build(); render(); }
    else if ($("#actSecs")) $("#actSecs").textContent = st.activity_seconds >= 2 ? st.activity_seconds + "s" : "";
    const rs = JSON.stringify([st.reader, st.local, st.pull, st.claude, st.local_model]);
    if (rs !== readerSig) { readerSig = rs; if (S.status === "idle" && !statusChanged) paintReader(); }
    const sig = events.length + S.status + S.mode + (S.accounts || []).length;
    if (sig !== panelSig) { panelSig = sig; loadPanels(); insightsData = null; if (tab === "insights") loadInsights(); }
    for (const e of fresh) if (e.type === "original" && e.seq > seenOriginal && !pageStart) { seenOriginal = e.seq; openOriginal(e.ref); }
    if (pageStart) { seenOriginal = events.length - 1; pageStart = false; }
  } catch (e) { $("#status").textContent = "not connected"; $("#status").className = "pill error"; }
  setTimeout(poll, S.status === "running" || S.status === "connecting" ? 500 : 1500);
}

function build() {
  cards = []; banner = [];
  for (const e of events) {
    const last = cards[cards.length - 1];
    const mail = last && last.lines ? last : null;       // the email card currently being filled
    if (e.type === "account") cards.push({account: e.user});
    else if (e.type === "email") cards.push({...e, lines: []});
    else if (e.type === "analysis" && mail) mail.analysis = e;
    else if (["done", "notice", "answer", "info", "reading"].includes(e.type) && mail) mail.lines.push(e);
    else if (["info", "notice", "done"].includes(e.type)) cards.push({banner: e.text});
  }
}

// ------------------------------------------------------------ rendering
function render() {
  const st = $("#status");
  const live0 = S.status === "running" || S.status === "connecting";
  const waiting = live0 && S.question;
  const lastMail = [...cards].reverse().find(c => c.lines);
  const L = S.live || {};
  const tallies = [L.auto ? `${L.auto} auto` : "", L.asked ? `${L.asked} by you` : "", L.one_off ? `${L.one_off} read & archived` : "",
                   L.skipped ? `${L.skipped} skipped` : ""].filter(Boolean).join(" · ");
  const prog = live0 && lastMail ? ` · email ${lastMail.n} of ${lastMail.total}${tallies ? ` <span class="tally">(${tallies})</span>` : ""}` : "";
  st.innerHTML = S.status === "idle" ? "ready"
    : S.status === "error" ? "error"
    : S.status === "finished" ? "✓ session finished"
    : waiting ? `● waiting for your answer${prog}`
    : `<span class="spin sm"></span> working${prog}`;
  st.className = "pill " + (S.status === "error" ? "error" : S.status === "finished" ? "done"
    : waiting ? "wait" : live0 ? "running" : "");
  $("#who").textContent = S.status === "idle" ? "" : S.mode === "demo" ? "Demo inbox" + (S.auto ? " · auto mode" : "") : (S.current_account || "") + (S.dry_run ? " · practice mode" : "") + (S.auto ? " · auto mode" : "");
  const live = S.status === "running" || S.status === "connecting";
  $("#stopBtn").style.display = live ? "" : "none";
  $("#newBtn").style.display = (S.status === "finished" || S.status === "error") ? "" : "none";

  const main = $("#main");
  const ta = $("#answer"); if (ta) draft = ta.value;
  if (S.status === "idle") { main.innerHTML = startScreen(); wireStart(); return; }

  let html = "";
  if (S.status === "error") html += `<div class="card"><h2>Something went wrong</h2><p class="err">${esc(S.error)}</p>
      <button class="btn primary" onclick="newSession()">Back</button></div>`;
  for (const b of banner) html += `<div class="banner">${esc(b)}</div>`;
  cards.forEach((c, i) => html += c.banner ? `<div class="banner">${esc(c.banner)}</div>` : c.account
    ? `<div class="acc-divider">📬 ${esc(c.account)}</div>`
    : mailCard(c, i === cards.length - 1 && S.status === "running"));
  const busyNow = (S.status === "running" || S.status === "connecting") && !S.question;
  const lastC = cards[cards.length - 1];
  const inCard = lastC && lastC.lines && S.status === "running";   // the active email card shows it itself
  if (busyNow && !inCard) html += workingCard();
  if (S.status === "finished") html += doneCard();
  main.innerHTML = html;
  wireAsk();
  const active = $(".mail.active");
  if (active && (lastRenderedCard !== cards.length || S.question)) {
    const r = active.getBoundingClientRect();
    if (lastRenderedCard !== cards.length || r.bottom > innerHeight) active.scrollIntoView({block: "end", behavior: "smooth"});
  }
  lastRenderedCard = cards.length;
  if (S.status === "finished" && lastRenderedStatus !== "finished") {
    const d = $(".done-card"); if (d) d.scrollIntoView({block: "center", behavior: "smooth"});
  }
  lastRenderedStatus = S.status;
}
let lastRenderedStatus = null;
let lastRenderedCard = 0;

function mailCard(c, isActive) {
  const a = c.analysis || {};
  const facts = Object.entries(a.facts || {}).map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd>${[].concat(v).map(x => k === "coupon code" ? `<code>${esc(x)}</code>` : esc(x)).join(k === "coupon code" ? " " : "<br>")}</dd>`).join("");
  const lines = c.lines.map(l => {
    if (l.type === "answer") return `<div class="line you"><span>${esc(l.text)}</span></div>`;
    if (l.type === "reading") return isActive && S.question
      ? `<div class="reading"><div class="reading-head">📖 Here's the full email — read it, then tell me when you're done</div>
          ${viewer(l.ref, l.view, "reading")}</div>`
      : `<div class="line done"><span class="ic">📖</span><span>You read it here · <button class="link" onclick="openOriginal(${l.ref})">open again</button></span></div>`;
    if (l.type === "notice" && /^Couldn't/.test(l.text)) return `<div class="movefail"><b>Could not move this email</b><span>${esc(l.text)}</span></div>`;
    const ic = l.type === "done" ? "✓" : l.type === "notice" ? "?" : "·";
    return `<div class="line ${l.type}"><span class="ic">${ic}</span><span>${esc(l.text)}</span></div>`;
  }).join("");
  return `<article class="mail ${isActive ? "active" : "past"}">
    <div class="mail-head">
      <div class="meta">${a.category ? `<span class="cat ${a.category === "security" ? "cat-sec" : ""}">${a.category === "security" ? "🔒 " : ""}${esc(a.category)}</span>` : ""}
        ${a.importance === "high" ? `<span class="tag imp" title="${esc(a.importance_reason || "")}">★ Important</span>` : ""}
        ${c.fresh ? `<span class="tag new">📨 just arrived</span>` : ""}<span>${c.n} of ${c.total}</span>${c.ref ? `<span>· #${c.ref}</span>` : ""}${a.engine && a.engine !== "offline" ? `<span>· read by ${esc(a.engine)}${a.seconds >= 1 ? ` in ${Math.round(a.seconds)}s` : ""}</span>` : ""}
        ${c.ref ? `<button class="link" onclick="openOriginal(${c.ref})">view original</button>` : ""}</div>
      <div class="subject">${esc(c.subject)}</div>
      <div class="from">${esc(c.sender)}${c.date ? " · " + esc(c.date) : ""}</div>
      ${a.summary ? `<div class="summary">${esc(a.summary)}</div>` : ""}
      ${warningBox(a)}
      ${facts ? `<dl class="facts">${facts}</dl>` : ""}
    </div>
    ${lines ? `<div class="lines">${lines}</div>` : ""}
    ${isActive && S.question ? askBox(S.question, c) : ""}
    ${isActive && !S.question ? workingLine() : ""}
  </article>`;
}

const SUGGESTIONS = ["Save the key info to my notes and archive it", "Add it to my to-do list and archive it",
  "Archive it", "Delete it", "Unsubscribe and delete it", "Leave it in my inbox"];

function askBox(q, c) {
  if (q.kind === "choice") {
    const opts = q.options.map((o, i) => {
      const sec = /^(Just read it|Show me the full)/.test(o);
      return `<button class="choice ${sec ? "secondary" : ""}" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`;
    }).join("");
    return `<div class="ask"><div class="prompt">${esc(q.prompt)}</div><div class="choices">${opts}</div></div>`;
  }
  const main = /^What should I do with it\?/.test(q.prompt);
  const prompt = main ? "What should I do with this email?" : q.prompt;
  return `<div class="ask"><div class="prompt">${esc(prompt)}</div>
    <div class="answer-row"><textarea id="answer" rows="1" placeholder="Tell me in your own words — e.g. “save the coupon code to my notes and delete it”">${esc(draft)}</textarea>
    <button class="btn primary" id="send">Send</button></div>
    <div class="chips-label">Quick answers</div>
    <div class="chips">${SUGGESTIONS.map(s => `<button class="chip" data-fill="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    ${main ? `<div class="chips">
      <button class="chip util" data-send="r">📖 Just read it &amp; archive — no rule</button>
      <button class="chip util" data-view="${c.ref}">👁 View original</button>
      <button class="chip util" data-send="skip">⏭ Skip for now</button>
    </div>` : ""}</div>`;
}

function warningBox(a) {
  if (a.risk === "high" || a.risk === "low") {
    const signs = (a.risk_signs || []).map(s => `<li>${esc(s)}</li>`).join("");
    return `<div class="warn ${a.risk}"><b>${a.risk === "high" ? "⚠️ Be careful — this could be a fake (phishing) email"
                                                            : "⚠️ Check this one before acting"}</b>
      ${signs ? `<ul>${signs}</ul>` : ""}
      <div class="warn-tip">Don't click its links or open attachments. If you're unsure, open the website or app yourself and check there.</div></div>`;
  }
  if (a.category === "security")
    return `<div class="warn info"><b>🔒 Security email</b>
      <div class="warn-tip">If you didn't expect this, check your account by going to the website yourself — not through the email's links.</div></div>`;
  if (a.importance === "high" && a.importance_reason)
    return `<div class="imp-reason">★ ${esc(a.importance_reason)}</div>`;
  return "";
}

function workingLine() {
  return `<div class="working"><span class="spin"></span><span id="actText">${esc(S.activity || "Working…")}</span>
    <span class="hint" id="actSecs">${S.activity_seconds >= 2 ? S.activity_seconds + "s" : ""}</span></div>`;
}
function workingCard() { return `<div class="card working-card">${workingLine()}</div>`; }

function doneCard() {
  const s = S.stats || {};
  const stat = (n, l) => `<div class="stat"><b>${n ?? 0}</b><span>${l}</span></div>`;
  const skipped = cards.filter(c => c.lines && c.lines.some(l => l.type === "notice" && /^Needs you/.test(l.text)));
  const skipBox = skipped.length ? `<div class="skiplist"><h3>${S.auto ? "Skipped in auto mode" : "Skipped"} · ${skipped.length} waiting, still unread</h3>
    ${skipped.map(c => `<div class="li"><span>${esc(c.sender)} · ${esc(c.subject)}</span></div>`).join("")}
    <div class="hint" style="margin-top:6px">They stay in your inbox. Start a normal session to go through them together.</div></div>` : "";
  const again = insightsData && insightsData.ask_again && insightsData.ask_again[0];
  return `<div class="card done-card"><h2>${s.stopped ? "Stopped — see you next time" : "All done for this session"}</h2>
    <div class="stats">${stat(s.auto, "handled by rules")}${stat(s.asked, "decided by you")}${stat(s.one_off, "read & archived")}
      ${stat(s.skipped, S.auto ? "need you (skipped)" : "skipped")}${stat(s.left, "left for next time")}</div>
    ${skipBox}
    ${again ? `<p class="hint">You have been asked about <b>${esc(again.sender)}</b> ${again.count} times lately. A rule for them would save those questions.</p>` : ""}
    <p class="hint">Emails left for next time are untouched in your inbox and will come up next session.</p>

  const count = k => k === "todos" ? (panels.todos || []).filter(t => !t.done).length : (panels[k] || []).length;
  $("#tabs").innerHTML = TABS.map(([k, l]) =>
    `<button class="tab ${k === tab ? "on" : ""}" data-t="${k}">${l}${k === "insights" || k === "look" ? "" : `<span class="n">${count(k)}</span>`}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.t; editingNote = null; renderPanels(); });
  if (tab === "insights") { $("#pane").innerHTML = insightsHtml(); if (!insightsData) loadInsights(); return; }
  if (tab === "look") { $("#pane").innerHTML = lookHtml(); wireLook(); return; }
  let list = panels[tab] || [];
  let hiddenDone = 0;
  if (tab === "todos") {
    const all = list;
    hiddenDone = all.filter(t => t.hidden).length;
    list = [...all.filter(t => !t.done), ...all.filter(t => t.done && (!t.hidden || showOldDone))];
  }
  const view = ref => ref ? `<button class="link" onclick="openOriginal(${ref})">view email #${ref}</button>` : "";
  const empty = {todos: "No to-dos yet.", notes: "Nothing saved to notes yet.", rules: "No rules yet — they appear as you answer.",
                 read_log: "Emails you “just read & archive” show up here.", history: "Every email the agent handles is kept here."}[tab];
  let html = (tab === "todos" || tab === "notes") ? cleanupBox() : "";
  html += list.length ? "" : `<div class="empty">${tab === "todos" && hiddenDone ? "Nothing left to do 🎉" : empty}</div>`;
  for (const x of list) {
    if (tab === "todos") html += `<div class="item todo ${x.done ? "is-done" : ""} ${rewriting.has("todo:" + x.id) ? "is-rewriting" : ""}">
        <input type="checkbox" ${x.done ? "checked" : ""} onclick="todoToggle(${x.id}, ${x.done ? "false" : "true"})"
               title="${x.done ? "Mark as not done" : "Mark as done"}">
        <div><div class="t">${esc(x.title)}</div>
        ${rewritingBanner("todo", x.id)}
        ${whenLine(x)}
        ${x.about && x.about !== x.title ? `<div class="about">${esc(x.about)}</div>` : ""}
        <div class="s">${esc(x.source)}${sentLabel(x)}</div>
        <div class="acts">${x.link ? `<a class="link" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.link_label || "open link")} ↗</a>` : ""}
          ${view(x.ref)}${x.ref && !/^Unsubscribe from /.test(x.title) && !x.done ? rewriteBtn("todo", x.id) : ""}
          <button class="link danger" onclick="todoDelete(${x.id})">delete</button></div></div></div>`;
    if (tab === "notes") html += editingNote === x.id
      ? `<div class="item note-edit"><input id="noteTitle" value="${esc(x.title)}">
          <textarea id="noteText">${esc(x.as_text)}</textarea>
          <div class="acts"><button class="btn small primary" onclick="saveNote(${x.id})">Save</button>
            <button class="btn small" onclick="editingNote = null; renderPanels()">Cancel</button></div></div>`
      : `<div class="item ${rewriting.has("note:" + x.id) ? "is-rewriting" : ""}"><div class="t">${esc(x.title)}</div>${rewritingBanner("note", x.id)}
          ${x.text != null ? `<div class="note-text">${esc(x.text)}</div>`
            : Object.entries(x.items).map(([k, v]) => `<div class="kv"><b>${esc(k)}:</b> ${esc(v)}</div>`).join("") || `<div class="kv">${esc(x.summary)}</div>`}
          ${x.link ? `<div class="kv"><a class="link" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.link_label || "open link")} ↗</a></div>` : ""}
          <div class="s">${esc(x.source)}${sentLabel(x)}</div>
          <div class="acts">${view(x.ref)}${x.ref && x.text == null ? rewriteBtn("note", x.id) : ""}<button class="link" onclick="editingNote = ${x.id}; renderPanels()">edit</button>
            ${x.in_todos ? `<button class="link" onclick="tab = 'todos'; renderPanels()" title="Show it in To-dos">✓ in to-dos</button>`
              : `<button class="link" onclick="noteToTodo(${x.id}, this)" title="Make a to-do from this note (the note stays)">→ to-do</button>`}
            <button class="link danger" onclick="delNote(${x.id})">delete</button>
            ${x.edited ? `<span class="s">edited</span>` : ""}</div></div>`;
    if (tab === "rules") html += `<div class="item"><div class="t">${esc(x.name)}</div>
        <div class="kv"><b>Does:</b> ${esc(x.actions)}</div>
        ${x.requires.length ? `<div class="kv"><b>Needs:</b> ${esc(x.requires.join(", "))}</div>` : ""}
        <div class="kv"><b>Asks you instead if it has:</b> ${esc(x.asks_if.join(", ") || "—")}</div>
        ${x.instruction ? `<div class="s">You said: “${esc(x.instruction)}”</div>` : ""}
        <div class="acts"><span class="s">used ${x.used}×</span><button class="link" style="color:var(--danger)" onclick="delRule('${x.id}')">forget this rule</button></div></div>`;
    if (tab === "read_log") html += `<div class="item"><div class="t">${esc(x.source)} — ${esc(x.subject)}</div>
        <div class="kv">${esc(x.summary)}</div>
        ${Object.entries(x.facts || {}).map(([k, v]) => `<div class="kv"><b>${esc(k.replace(/_/g, " "))}:</b> ${esc(Array.isArray(v) ? v.join("; ") : v)}</div>`).join("")}
        <div class="acts">${view(x.ref)}</div></div>`;
    if (tab === "history") html += `<div class="item"><div class="t">#${x.ref} ${esc(x.subject)}</div>
        <div class="s">${esc(x.from)}</div>
        <div class="acts"><span class="loc ${x.location}">${esc(x.location)}</span>
          <span class="s">${esc(x.handled_by || "waiting for you")}</span>${view(x.ref)}</div></div>`;
  }
  if (tab === "todos" && hiddenDone)
    html += `<div class="s" style="padding:10px 0"><button class="link" onclick="showOldDone = !showOldDone; renderPanels()">${
      showOldDone ? "Hide finished from earlier" : `Show ${hiddenDone} finished from earlier`}</button></div>`;
  const err = panelsError || (panels.errors || {})[tab];
  if (err) html = `<div class="err" style="padding:12px 0">Couldn't load this list (${esc(err)}). Try closing the app's Terminal window and starting it again.</div>` + html;
  $("#pane").innerHTML = html;
}
let showOldDone = false;
// "· email from Sep 28" — the lists are sorted by this, newest first
function sentLabel(x) {
  if (!x.sent) return "";
  const d = new Date(x.sent), now = new Date();
  const opts = {month: "short", day: "numeric", ...(d.getFullYear() !== now.getFullYear() ? {year: "numeric"} : {})};
  return ` · email from ${esc(d.toLocaleDateString(undefined, opts))}`;
}
// a to-do's date on its own line, coloured by how close it is
function whenLine(x) {
  const w = x.when; if (!w) return "";
  if (!w.date) return `<div class="when"><span class="when-chip">📅 ${esc(w.text)}</span></div>`;
  const d = new Date(w.date + "T12:00:00"), n = w.days;
  const day = d.toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric",
                                               ...(d.getFullYear() !== new Date().getFullYear() ? {year: "numeric"} : {})});
  const rel = n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday"
            : n > 0 ? `in ${n} days` : `${-n} days ago`;
  const cls = x.done ? "" : n < 0 ? "overdue" : n <= 1 ? "soon" : n <= 7 ? "week" : "later";
  return `<div class="when"><span class="when-chip ${cls}">📅 ${esc(day)}${w.time ? " · " + esc(w.time) : ""} · ${rel}${cls === "overdue" ? " — overdue" : ""}</span>
    ${w.text ? `<span class="when-text">${esc(w.text)}</span>` : ""}</div>`;
}
// ------------------------------------------------------------ clean-up of old notes & to-dos
let cleanupOpen = false, cuDays = 30, cuKeep = true, cuInfo = null, cuBusy = false;
function cleanupBox() {
  if (!cleanupOpen)
    return `<div class="cu-bar"><span class="s">Newest emails first</span><button class="link" onclick="openCleanup()" title="Remove notes and to-dos about old emails">🧹 Clean up old notes &amp; to-dos</button></div>`;
  const i = cuInfo;
  const preview = !i ? `<span class="spin sm"></span> Counting…`
    : (i.notes || i.todos)
      ? `Removes <b>${i.notes}</b> of ${i.notes_total} notes and <b>${i.todos}</b> of ${i.todos_total} to-dos.` +
        (i.kept_upcoming ? ` Keeps ${i.kept_upcoming} to-do${i.kept_upcoming > 1 ? "s" : ""} with a due date still ahead.` : "")
      : i.kept_upcoming ? `Nothing to remove — the only older ones are ${i.kept_upcoming} to-do${i.kept_upcoming > 1 ? "s" : ""} with a due date still ahead.`
      : `Nothing that old — all your notes and to-dos are about emails from the last ${i.days} days.`;
  const last = i && i.last ? `<div class="s" style="margin-top:8px">Last clean-up ${esc(i.last.at.slice(0, 16).replace("T", " "))}:
      ${i.last.notes} notes, ${i.last.todos} to-dos · <button class="link" onclick="undoCleanup()" ${cuBusy ? "disabled" : ""}>undo it</button></div>` : "";
  return `<div class="cu-box">
    <div class="t">🧹 Clean up old notes &amp; to-dos</div>
    <div class="cu-row">Remove the ones about emails older than
      <input type="number" id="cuDays" min="1" value="${cuDays}" onchange="cuDays = +this.value || 30; previewCleanup()"> days</div>
    <label class="check" style="margin:6px 0"><input type="checkbox" ${cuKeep ? "checked" : ""} onchange="cuKeep = this.checked; previewCleanup()">
      <span>Keep to-dos whose due date is still ahead</span></label>
    <div class="cu-preview">${preview}</div>
    <div class="acts" style="margin-top:8px">
      <button class="btn small primary" onclick="runCleanup()" ${!i || !(i.notes || i.todos) || cuBusy ? "disabled" : ""}>${cuBusy ? "Cleaning…" : "Clean up"}</button>
      <button class="btn small" onclick="cleanupOpen = false; renderPanels()">Close</button></div>
    <div class="s" style="margin-top:6px">Age is the email's date, not when the note was made. Removed items are kept in a backup, so you can undo.</div>
    ${last}</div>`;
}
async function previewCleanup() {
  cuInfo = null; renderPanels();
  try { cuInfo = await api("/api/cleanup/preview", {days: cuDays, keep_upcoming: cuKeep}); }
  catch (e) { toast(e.message); cleanupOpen = false; }
  renderPanels();
}
function openCleanup() { cleanupOpen = true; previewCleanup(); }
async function runCleanup() {
  if (!confirm(`Remove ${cuInfo.notes} notes and ${cuInfo.todos} to-dos about emails older than ${cuDays} days?`)) return;
  cuBusy = true; renderPanels();
  try { const r = await api("/api/cleanup/run", {days: cuDays, keep_upcoming: cuKeep});
        toast(`Cleaned up: ${r.removed_notes} notes and ${r.removed_todos} to-dos removed`); }
  catch (e) { toast(e.message); }
  cuBusy = false; await previewCleanup(); await loadPanelsForce();
}
async function undoCleanup() {
  cuBusy = true; renderPanels();
  try { const r = await api("/api/cleanup/undo", {}); toast(`Restored ${r.notes} notes and ${r.todos} to-dos`); }
  catch (e) { toast(e.message); }
  cuBusy = false; await previewCleanup(); await loadPanelsForce();
}
async function loadPanelsForce() {
  try { panels = await api("/api/panels"); panelsError = null; } catch (e) { panelsError = e.message; }
  renderPanels();
}
const rewriting = new Map();   // "todo:3" -> start time; survives the sidebar redrawing itself
async function rewrite(kind, id) {
  const key = `${kind}:${id}`;
  if (rewriting.has(key)) return;                 // already in progress: ignore extra clicks
  rewriting.set(key, Date.now()); renderPanels();
  const tick = setInterval(() => {                 // keep the seconds counter moving
    const el = document.querySelector(`[data-rw="${key}"] .rw-secs`);
    if (el) el.textContent = Math.round((Date.now() - rewriting.get(key)) / 1000) + "s";
  }, 1000);
  try { const r = await api(`/api/${kind}/${id}/rewrite`, {}); toast(`Rewritten: “${r.title}”`); }
  catch (e) { toast(e.message); }
  finally { clearInterval(tick); rewriting.delete(key); await loadPanels(); }
}
function rewriteBtn(kind, id) {
  const key = `${kind}:${id}`;
  if (rewriting.has(key)) return `<button class="link" disabled>✨ rewriting…</button>`;
  return `<button class="link" onclick="rewrite('${kind}', ${id})" title="Re-read the original email with AI and rewrite this">✨ rewrite</button>`;
}
function rewritingBanner(kind, id) {
  const key = `${kind}:${id}`;
  if (!rewriting.has(key)) return "";
  const secs = Math.round((Date.now() - rewriting.get(key)) / 1000);
  return `<div class="rw-banner" data-rw="${key}"><span class="spin sm"></span> Re-reading the original email with AI… <span class="rw-secs">${secs}s</span></div>`;
}
async function todoToggle(id, done) { await api(`/api/todo/${id}/${done ? "done" : "undo"}`, {}); loadPanels(); }
async function todoDone(id) { return todoToggle(id, true); }
async function todoDelete(id) {
  if (!confirm("Delete this to-do?")) return;
  await api(`/api/todo/${id}/delete`, {}); loadPanels();
}
async function delRule(id) { if (confirm("Forget this rule? Similar emails will be asked about again.")) { await api(`/api/rule/${id}/delete`, {}); loadPanels(); } }

// ------------------------------------------------------------ original email modal
let modalRef = null;
async function openOriginal(ref) {
  try {
    const {entry, email, view} = await api(`/api/original/${ref}`);
    modalRef = ref;
    $("#mHead").innerHTML = `<div class="meta"><span>#${ref}</span></div>
      <div class="subject">${esc(email.subject)}</div><div class="from">${esc(email.sender)}${email.date ? " · " + esc(email.date) : ""}</div>`;
    $("#mBody").innerHTML = viewer(ref, view, "modal");
    $("#mWhere").textContent = `Now in: ${entry.location}` + (entry.handled_by ? ` · ${entry.handled_by}` : "");
    $("#mRestore").style.display = entry.location === "inbox" ? "none" : "";
    $("#modalBg").classList.add("show");
  } catch (e) { toast(e.message); }
}
// ------------------------------------------------------------ formatted email viewer
const viewOpts = {};   // per email: {images, plain}
function viewer(ref, info, where) {
  info = info || {};
  const o = viewOpts[ref] || (viewOpts[ref] = {images: false, plain: false});
  const src = `/api/original/${ref}/view?images=${o.images ? 1 : 0}&plain=${o.plain ? 1 : 0}`;
  const tools = [];
  if (info.has_html) tools.push(`<button class="seg ${o.plain ? "" : "on"}" onclick="setView(${ref}, 'plain', false)">Formatted</button><button class="seg ${o.plain ? "on" : ""}" onclick="setView(${ref}, 'plain', true)">Plain text</button>`);
  if (info.has_remote_images && !o.plain) tools.push(o.images
      ? `<span class="hint">Images loaded</span>`
      : `<span class="hint">🛡 Remote images are blocked so the sender can't tell you opened it.</span><button class="btn small" onclick="setView(${ref}, 'images', true)">Load images</button>`);
  return `<div class="viewer ${where}" data-ref="${ref}" data-info='${esc(JSON.stringify(info))}'>
    ${tools.length ? `<div class="viewer-tools">${tools.join("")}</div>` : ""}
    <iframe class="mailframe" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" src="${src}" title="Email"></iframe></div>`;
}
function setView(ref, key, val) {
  (viewOpts[ref] = viewOpts[ref] || {images: false, plain: false})[key] = val;
  document.querySelectorAll(`.viewer[data-ref="${ref}"]`).forEach(el => {
    const info = JSON.parse(el.dataset.info || "{}");
    const where = el.classList.contains("modal") ? "modal" : "reading";
    el.outerHTML = viewer(ref, info, where);
  });
}

function closeModal() { $("#modalBg").classList.remove("show"); const ta = $("#answer"); if (ta) ta.focus(); }
$("#mClose").onclick = closeModal;
$("#modalBg").onclick = e => { if (e.target.id === "modalBg") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$("#mRestore").onclick = async () => {
  try { const r = await api(`/api/restore/${modalRef}`, {}); toast(r.result); closeModal(); loadPanels(); }
  catch (e) { toast(e.message); }
};

// number keys pick menu options when no text box has focus
document.addEventListener("keydown", e => {
  if (!S.question || S.question.kind !== "choice" || $("#modalBg").classList.contains("show")) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= S.question.options.length) answer(String(n - 1));
});

render(); poll();
</script>
</body>
