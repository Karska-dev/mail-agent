name: release

# Builds "Mail Agent.app" (Apple Silicon) and publishes it as a GitHub release named after the version in
# email_agent/__init__.py. Start it by pushing a tag like v1.0.0, or from the Actions tab: release → Run workflow
# (the workflow then creates the tag itself).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-app:
    runs-on: macos-latest   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Work out the version and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('email_agent/__init__.py').read()).group(1))")
          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION"; exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - raise the version in email_agent/__init__.py first"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install build tools
        run: python -m pip install pyinstaller pytest

      - name: Run the tests
        run: python -m pytest -q

      - name: Build Mail Agent.app
        run: python -m PyInstaller --noconfirm --clean packaging/mac/MailAgent.spec

      - name: Check the app starts, serves its page and quits
        env:
          MAIL_AGENT_NO_BROWSER: "1"
          EMAIL_AGENT_DATA: ${{ runner.temp }}/mail-agent-data
        run: |
          file "dist/Mail Agent.app/Contents/MacOS/Mail Agent" | grep -q arm64
          "dist/Mail Agent.app/Contents/MacOS/Mail Agent" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ | grep -q "Mail Agent"
          curl -sf -X POST http://127.0.0.1:8765/api/quit
          for i in $(seq 1 10); do curl -sf http://127.0.0.1:8765/ > /dev/null || exit 0; sleep 1; done
          echo "The app did not quit"; exit 1

      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Mail Agent.app" Mail-Agent-mac-apple-silicon.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" Mail-Agent-mac-apple-silicon.zip --target "$GITHUB_SHA" \
            --title "Mail Agent ${TAG#v}" --notes-file packaging/mac/release-notes.md
